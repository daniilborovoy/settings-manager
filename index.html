<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings Manager</title>
    <script>
      // Apply the saved/system theme + design style before first paint to avoid a flash.
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved || (prefersDark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var comic = localStorage.getItem('comic-style') === 'on'
          document.documentElement.setAttribute('data-comic', comic ? 'on' : 'off')
        } catch (e) {
          document.documentElement.setAttribute('data-comic', 'off')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
